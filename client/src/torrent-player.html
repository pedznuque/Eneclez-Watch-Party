<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Torrent Player</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#f6f7fb; font:14px Arial,sans-serif; }
        video { width:100%; height:100%; object-fit:contain; }
        #subtitleControls { position:fixed; z-index:30; top:12px; right:12px; max-width:calc(100% - 24px); padding:9px 12px; background:#121720e8; border:1px solid #ffffff20; border-radius:12px; font-size:12px; pointer-events:auto; }
        #subtitleControls label { display:flex; align-items:center; gap:10px; font-weight:600; }
        #subtitleControls select { min-width:110px; max-width:min(260px,55vw); background:#222a38; color:#fff; padding:7px 9px; border:1px solid #ffffff30; border-radius:7px; cursor:pointer; color-scheme:dark; }
        #subtitleControls select:focus-visible, #subtitleRetry:focus-visible { outline:2px solid #43c6ac; outline-offset:3px; }
        #subtitleNotice { display:block; margin-top:4px; color:#bac3d3; font-size:11px; }
        #subtitleNotice:empty { display:none; }
        #subtitleRetry { margin-top:6px; border:1px solid #43c6ac66; border-radius:7px; padding:5px 9px; color:#43c6ac; background:transparent; cursor:pointer; }
        #subtitleText { position:fixed; z-index:20; bottom:12%; left:8%; right:8%; text-align:center; white-space:pre-line; font-size:clamp(18px,3vw,32px); font-weight:bold; text-shadow:2px 2px 3px #000,-2px -2px 3px #000; pointer-events:none; }
        #status { position:fixed; z-index:10; bottom:12px; left:12px; right:12px; padding:10px 12px; background:#121720e8; border:1px solid #ffffff15; border-radius:10px; font-size:12px; line-height:1.6; pointer-events:none; }
        [hidden] { display:none !important; }
    </style>
</head>
<body>
    <video id="video" playsinline preload="auto"></video>
    <div id="subtitleControls">
        <label for="subtitleSelect">Subtitles <select id="subtitleSelect" aria-label="Subtitle track"><option value="off">Off</option></select></label>
        <span id="subtitleNotice" role="status"></span>
        <button id="subtitleRetry" type="button" hidden>Retry subtitle search</button>
    </div>
    <div id="subtitleText" hidden></div>
    <div id="status" role="status">Buffering the opening video pieces…</div>
    <script src="torrent-links.js"></script>
    <script src="torrent-player.js"></script>
    <script src="torrent-subtitles.js"></script>
</body>
</html>
